<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xCoreTX</title>
  <style>
    /* Global Styles */
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #1a1a1a;
      background: #fefefe;
    }
    a { color: #0077cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    section { padding: 60px 20px; max-width: 900px; margin: auto; }
    h1, h2, h3 { margin-bottom: 20px; }
    h1 { font-size: 2.5rem; color: #004466; }
    h2 { font-size: 2rem; color: #006699; }
    h3 { font-size: 1.5rem; color: #004466; }
    p { margin-bottom: 20px; }

    /* Navigation Section */
    #nav {
      text-align: center;
      background: #e0f3ff;
      padding: 100px 20px;
    }
    #nav h1 { font-size: 3rem; }
    #nav p { font-size: 1.3rem; margin-top: 10px; color: #004466; }
    .nav-buttons a {
      display: inline-block;
      margin: 10px 15px;
      padding: 12px 25px;
      background: #0077cc;
      color: white;
      border-radius: 5px;
      font-weight: bold;
    }
    .nav-buttons a:hover { background: #005f99; }

    /* Section Styles */
    #about, #labs, #notes, #resources {
      background: #fefefe;
    }
    .labs-table, {
      width: 100%;
      border-collapse: collapse;
    }
    .labs-table th, .labs-table td, {    
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
    }
    .labs-table th, { background: #e0f3ff; color: #004466; }

    /* Footer */
    footer {
      background: #004466;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
    }

    /* Responsive */
    @media(max-width: 600px){
      h1 { font-size: 2rem; }
      h2 { font-size: 1.5rem; }
      .nav-buttons a { display: block; margin: 10px auto; }
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <section id="nav">
    <h1>xCoreTX</h1>
    <p>Learn. Apply. Grow.</p>
    <div class="hero-buttons">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#labs">See My Work</a>
      <a href="#notes">Notes</a>
      <a href="#resources">Resources</a>
    </div>
  </section>

  <!-- About Section -->
  <section id="about">
    <h2>About Me</h2>
    <p></p>
  </section>

  <!-- Projects Section -->
  <section id="labs">
    <h2>Projects</h2>
    <table class="projects-table">
      <tr>
        <th>Project</th>
        <th>Actions</th>
        <th>Outcome</th>
      </tr>
      <tr>
        <td></td>
        <td></td>
        <td></td>
      </tr>
      <tr>
        <td></td>
        <td></td>
        <td></td>
      </tr>
    </table>
  </section>

  <!-- Footer -->
  <footer>
    Learn. Apply. Grow. | &copy; 2026
  </footer>

</body>
</html>
